name: Mantener despierta la base de WLGM

# Supabase pausa los proyectos gratis que pasan 7 días sin actividad.
# Esto le hace una consulta de solo lectura todos los días para que no se duerma.
# Si algún día la base no responde, el trabajo falla y GitHub avisa por correo.

on:
  schedule:
    - cron: "17 14 * * *" # todos los días: 8:17 a. m. en Utah en verano, 7:17 a. m. en invierno
  workflow_dispatch: # para correrlo a mano desde la pestaña Actions
  push:
    branches: [main]
    paths:
      - ".github/workflows/mantener-supabase-despierto.yml" # corre una vez al subir este archivo

jobs:
  despertar:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Consulta de solo lectura a Supabase
        env:
          SUPABASE_URL: https://eacmntypjwsncjlduhro.supabase.co
          # Llave publicable: es la misma que ya está en app/index.html. No es secreta.
          SUPABASE_KEY: sb_publishable_fuAY6y-PxjNrzr1iLU25ZA_vGM1F9T4
        run: |
          codigo=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            -H "apikey: $SUPABASE_KEY" \
            -H "User-Agent: wlgm-mantener-despierto" \
            "$SUPABASE_URL/rest/v1/colores?select=*&limit=1")
          echo "Supabase respondió: $codigo"
          if [ "$codigo" != "200" ]; then
            echo "::error::La base de WLGM no respondió 200. Puede estar pausada: entra a supabase.com y dale Resume project."
            exit 1
          fi
